version: "3.1"

rules:

- rule: Say goodbye anytime the user says goodbye
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: greet rule
  steps:
  - intent: greet
  - action: utter_greet

- rule: ask services rule
  steps:
  - intent: ask_services
  - action: utter_services

- rule: ask pricing rule
  steps:
  - intent: ask_pricing
  - action: utter_pricing

- rule: ask process rule
  steps:
  - intent: ask_process
  - action: utter_process

- rule: ask ai automation rule
  steps:
